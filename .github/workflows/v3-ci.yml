name: v3-ci

on:
  push:
    branches: [production-v2, main]
  pull_request:
    branches: [main]

concurrency:
  group: v3-ci-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ppm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install
        run: npm ci

      - name: Dependency audit snapshot
        run: npm audit --json > dependency-audit.json || true

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence-${{ github.sha }}
          path: |
            dependency-audit.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Generate initial migration when absent
        if: github.ref == 'refs/heads/production-v2'
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: |
          if [ ! -f packages/database/prisma/migrations/0001_init/migration.sql ]; then
            mkdir -p packages/database/prisma/migrations/0001_init
            npx prisma migrate diff --from-empty --to-schema-datamodel packages/database/prisma/schema.prisma --script > packages/database/prisma/migrations/0001_init/migration.sql
            printf 'provider = "postgresql"\n' > packages/database/prisma/migrations/migration_lock.toml
            git config user.name "ppm-ci"
            git config user.email "actions@users.noreply.github.com"
            git add packages/database/prisma/migrations
            git commit -m "v3: generate initial Prisma migration"
            git pull --rebase origin production-v2
            git push origin HEAD:production-v2
          fi

      - name: Type check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run typecheck

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-only-placeholder-secret-that-is-long-enough
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

      - name: End-to-end API smoke
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ppm_test
          JWT_SECRET: ci-e2e-secret-that-is-long-enough-for-fastify-jwt
          APP_ORIGIN: http://localhost:3000
          PAYMENT_PROVIDER: dev
          SMS_PROVIDER: dev
          EMAIL_PROVIDER: dev
          DEMO_PASSWORD: DemoPass!2026
          ADMIN_EMAIL: admin@ppmbites.local
          ADMIN_INITIAL_PASSWORD: PPMAdmin!2026Change
        run: |
          npm run db:migrate
          npm run db:seed
          npm run bootstrap:admin -w @ppm/database
          npm run start -w @ppm/api > /tmp/ppm-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/health
          node e2e-smoke.mjs

      - name: Upload API smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log-${{ github.sha }}
          path: /tmp/ppm-api.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit reproducible lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ppm-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "v3: pin npm dependency graph"
            git restore .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
